<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="漳州慢行图：从九龙公园一带出发的古城步行路线和浦头港短线、自绘地图，以及走哪里、吃什么的判断。"></head><body><title>漳州慢行图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed hand-drawn city plan; a reading panel docks left on wide screens and becomes a bottom sheet on phones. */
:root{
  --land:#eceee6; --land-2:#e2e5da; --block:#d9dccf; --green:#cfdcc0; --green-2:#bccfa9;
  --water:#a9c8cc; --water-line:#8fb5ba; --road:#ffffff; --road-case:#c9cabf; --road-major:#fbf3dc; --road-major-case:#c7b98f;
  --path:#8d8f84; --rail:#9a9b92; --label:#3b3f38; --label-halo:rgba(236,238,230,.92); --label-water:#3f6f76;
  --ink:#20251f; --ink-2:#4a5147; --ink-3:#737a6f; --paper:#f7f7f2; --paper-2:#efefe8; --rule:#d8dacf;
  --zao:#b3363f; --zao-soft:#f3dcdc; --banyan:#2f5d3a; --banyan-soft:#dce8d8; --river:#2f6f7a; --river-soft:#d8eaec;
  --stone:#8a7f6e; --good:#2f7a4a; --warn:#b07b12; --bad:#a23a3a;
  --f-display:"Noto Serif SC","Songti SC","STSong",serif;
  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --panel-w:420px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --land:#1c211f; --land-2:#20262300; --block:#262c29; --green:#223125; --green-2:#29402d;
  --water:#1d3a42; --water-line:#2a5460; --road:#39403c; --road-case:#1a1e1c; --road-major:#4d4a3c; --road-major-case:#1a1e1c;
  --path:#7b8279; --rail:#5c625d; --label:#d6dcd3; --label-halo:rgba(28,33,31,.92); --label-water:#8cc3cb;
  --ink:#e6ebe3; --ink-2:#b9c1b5; --ink-3:#8b9489; --paper:#161a18; --paper-2:#1e2320; --rule:#2e3531;
  --zao:#e0707a; --zao-soft:#3a2326; --banyan:#8cc79a; --banyan-soft:#203024; --river:#7fc2cc; --river-soft:#1c3136;
  --stone:#b3a58f; --good:#6cc28b; --warn:#e0b04f; --bad:#e27b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --land:#1c211f; --land-2:#20262300; --block:#262c29; --green:#223125; --green-2:#29402d;
  --water:#1d3a42; --water-line:#2a5460; --road:#39403c; --road-case:#1a1e1c; --road-major:#4d4a3c; --road-major-case:#1a1e1c;
  --path:#7b8279; --rail:#5c625d; --label:#d6dcd3; --label-halo:rgba(28,33,31,.92); --label-water:#8cc3cb;
  --ink:#e6ebe3; --ink-2:#b9c1b5; --ink-3:#8b9489; --paper:#161a18; --paper-2:#1e2320; --rule:#2e3531;
  --zao:#e0707a; --zao-soft:#3a2326; --banyan:#8cc79a; --banyan-soft:#203024; --river:#7fc2cc; --river-soft:#1c3136;
  --stone:#b3a58f; --good:#6cc28b; --warn:#e0b04f; --bad:#e27b7b; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;overflow:hidden}
*{box-sizing:border-box}
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--panel-w) 1fr}
#map{position:relative;background:var(--land);min-width:0}
#panel{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper);border-right:1px solid var(--rule);z-index:500}
.brand{padding:14px 18px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--rule)}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:22px;margin:0;letter-spacing:.04em}
.brand .sub{font-size:12px;color:var(--ink-3)}
.brand .grow{flex:1}
.iconbtn{appearance:none;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink-2);border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
.iconbtn:hover{color:var(--ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 10px 0;border-bottom:1px solid var(--rule);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;border:0;background:none;font:inherit;font-size:14px;color:var(--ink-3);padding:8px 10px 9px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--zao);font-weight:600}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
#content h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:22px 0 8px;text-wrap:balance;line-height:1.35}
#content h3{font-size:16px;margin:18px 0 6px;text-wrap:balance}
#content h4{font-size:14px;margin:14px 0 4px;color:var(--ink-2)}
#content p{margin:6px 0 10px}
#content ul,#content ol{padding-left:1.2em;margin:6px 0 10px}
#content li{margin:3px 0}
#content a{color:var(--river)}
#content table{border-collapse:collapse;font-size:13px;width:100%}
.tw{overflow-x:auto;margin:8px 0 14px}
#content th,#content td{border-bottom:1px solid var(--rule);padding:6px 6px;text-align:left;vertical-align:top}
#content th{font-weight:600;color:var(--ink-2);white-space:nowrap}
.lede{font-size:16px;color:var(--ink-2)}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase;margin-top:18px}
.note{font-size:12.5px;color:var(--ink-3)}
.k{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;line-height:1;padding:4px 7px 4px;border-radius:99px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;vertical-align:1px}
.v-must{background:var(--zao);border-color:var(--zao);color:#fff}
.v-good{background:var(--banyan-soft);border-color:transparent;color:var(--banyan)}
.v-opt{background:var(--paper-2);color:var(--ink-3)}
.v-skip{background:transparent;color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.fact{border-left:3px solid var(--river);padding:2px 0 2px 10px;margin:8px 0}
.judge{border-left:3px solid var(--zao);padding:2px 0 2px 10px;margin:8px 0}
.web{border-left:3px solid var(--stone);padding:2px 0 2px 10px;margin:8px 0}
.tag-fact,.tag-judge,.tag-web{font-size:11px;font-weight:600;margin-right:4px}
.tag-fact{color:var(--river)} .tag-judge{color:var(--zao)} .tag-web{color:var(--stone)}
.stale{color:var(--warn);font-size:12px}
.card{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--paper)}
.card h3{margin-top:0}
.poi-row{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.poi-row:hover .pn{text-decoration:underline}
.poi-row .dot{width:11px;height:11px;border-radius:50%;margin-top:6px}
.poi-row .pn{font-weight:600}
.poi-row .ps{font-size:13px;color:var(--ink-2)}
.poi-row>div{min-width:0}
.linkrow{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.btn{appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}
#content a.btn{color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#content a.btn.primary{color:var(--paper)}
.btn:focus-visible,.iconbtn:focus-visible,nav.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--zao);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;margin:6px 0}
.seg button{appearance:none;border:0;background:var(--paper);color:var(--ink-2);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.day{margin:14px 0 22px}
.day-h{display:flex;align-items:baseline;gap:8px;cursor:pointer}
.day-h .dn{font-family:var(--f-display);font-weight:900;font-size:26px;color:var(--zao);line-height:1}
.day-h .dt{font-family:var(--f-display);font-weight:600;font-size:18px}
.steps{list-style:none;padding:0 !important;margin:10px 0 !important;position:relative}
.steps li{display:grid;grid-template-columns:52px 1fr;gap:10px;margin:0 !important;padding:6px 0}
.steps .tm{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3);padding-top:2px}
.steps .leg{font-size:12.5px;color:var(--ink-3);padding:0 0 0 62px;margin:-2px 0 2px !important;display:block}
.steps .leg.walk::before{content:"";display:inline-block;width:16px;border-top:2px dashed var(--zao);vertical-align:3px;margin-right:6px}
.steps .leg.ride::before{content:"";display:inline-block;width:16px;border-top:2px dotted var(--ink-3);vertical-align:3px;margin-right:6px}
.steps .free{color:var(--banyan);font-weight:600}
.steps .poiname{font-weight:600;cursor:pointer;border-bottom:1px dotted var(--ink-3)}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
/* map chrome */
.mapbar{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:600;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.mapbar .grp{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mapbar button{appearance:none;border:0;border-bottom:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit;font-size:13px;min-width:40px;height:38px;padding:0 10px;cursor:pointer}
.mapbar button:last-child{border-bottom:0}
.mapbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.filters{position:absolute;left:10px;right:64px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:600;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto}
.filters::-webkit-scrollbar{display:none}
.filters button{appearance:none;flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;font:inherit;font-size:12.5px;padding:5px 10px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);display:inline-flex;align-items:center;gap:6px}
.filters button .dot{width:9px;height:9px;border-radius:50%}
.filters button[aria-pressed="false"]{opacity:.45}
.scale{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:600;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);background:var(--label-halo);padding:2px 6px;border-radius:6px}
.scale i{display:block;height:4px;border:1.5px solid var(--ink-2);border-top:0;margin-top:2px}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top,0px));z-index:700;background:var(--ink);color:var(--paper);font-size:13px;padding:8px 12px;border-radius:10px;max-width:86%;box-shadow:0 2px 10px rgba(0,0,0,.25)}
/* markers */
.pm{position:relative}
.pm b{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.pm.must b{width:18px;height:18px;left:-9px;top:-9px;box-shadow:0 0 0 2px var(--ink)}
.pm.skip b{opacity:.55}
.pm.done b::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--paper)}
.pm span{position:absolute;left:11px;top:-9px;white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink);text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land);display:none;pointer-events:none}
.pm.sel b{transform:scale(1.5);box-shadow:0 0 0 3px var(--ink)}
.show-labels .pm span,.pm.sel span,.pm.inday span{display:block}
.pm .num{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--zao);color:#fff;font:600 11px/20px var(--f-mono);text-align:center;border:2px solid var(--paper)}
.leaflet-container{background:var(--land) !important;font-family:var(--f-body)}
.here{width:16px;height:16px;border-radius:50%;background:#2d7ff9;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 0 8px rgba(45,127,249,.18)}
.sheet-handle{display:none}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr}
  #map{grid-row:1;grid-column:1}
  #panel{grid-row:1;grid-column:1;position:absolute;z-index:1000;left:0;right:0;bottom:0;height:46%;border-right:0;border-top:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18);transition:height .25s ease}
  #panel.s-min{height:120px}
  #panel.s-max{height:calc(100% - 54px - env(safe-area-inset-top,0px))}
  .brand{padding-top:4px}
  .sheet-handle{display:block;width:100%;height:18px;border:0;background:none;cursor:pointer;flex:none}
  .sheet-handle::before{content:"";display:block;margin:7px auto 0;width:40px;height:5px;border-radius:3px;background:var(--rule)}
  .filters{bottom:auto;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:60px}
  .scale{top:auto;bottom:calc(47% + 8px)}
  .leaflet-bottom.leaflet-right{bottom:calc(46% + 2px)}
  .leaflet-control-attribution{font-size:9px;opacity:.8}
}
@media (prefers-reduced-motion: reduce){#panel{transition:none}}
</style>

window.TRIP={"cats":{"walk":{"n":"街巷","col":"#3d7a4c"},"sight":{"n":"建筑·古迹","col":"#8a5a2b"},"nature":{"n":"江·桥","col":"#2f7582"},"food":{"n":"吃","col":"#b3363f"},"cafe":{"n":"咖啡·茶","col":"#c47f16"},"stay":{"n":"住","col":"#5b4fa3"}},"pois":[{"id":"hotel","q":"璞境HOTEL民宿","n":"璞境·HOTEL民宿（九龙公园店）","c":"stay","ll":[24.515,117.6594],"v":"good","area":"元光南路","acc":"street","s":"元光南路 2-29 号，九龙公园西侧，2026 年开业。到古城东缘步行约 1 公里，到浦头港约 1.2 公里。","d":"<p class=\"fact\"><span class=\"tag-fact\">事实</span>二楼有自助洗衣房（2 台洗衣机、2 台烘干机）。每间房独立空调。</p><p class=\"judge\"><span class=\"tag-judge\">判断</span>它在古城和浦头港中间，两边都能走到。进古城从东边的台湾路进，不要绕到北入口（中闽百汇）。</p><p class=\"stale\">位置是按门牌放在元光南路北段的，误差约 150 米，以地图 App 为准。</p>"},{"id":"jlpark","q":"九龙公园","n":"九龙公园","c":"walk","ll":[24.515,117.6612],"v":"opt","area":"元光南路","acc":"osm","s":"酒店对面的市民公园。早晚散步用，不是景点。"},{"id":"park","q":"中山公园","n":"中山公园（府衙旧址 · 七星池）","c":"walk","ll":[24.51041,117.64881],"v":"opt","area":"古城北","acc":"osm","s":"1990 年代翻建过的城市公园。只当进古城的通道，十几分钟穿完。"},{"id":"fucheng","q":"府埕","n":"府埕 · 芳华横路","c":"walk","ll":[24.5095,117.6483],"v":"opt","area":"古城","acc":"est","s":"原府衙前的小广场，周边是小吃和非遗体验点，偏游客。早餐可以在这一带解决。"},{"id":"taiwanlu","q":"台湾路","n":"台湾路","c":"walk","ll":[24.50866,117.65026],"v":"good","area":"古城","acc":"osm","s":"骑楼老店街。早上店没开、人没来的时候最好看。","d":"<p class=\"web\"><span class=\"tag-web\">网上评价</span>来源冲突：2023 年的游记说这里“没有网红店、夜晚静寂”；2025–2026 的报道说商铺林立、旅拍店已经进了小巷。我取中间：仍有住家，但不安静了。</p>"},{"id":"paifang","q":"尚书探花坊","n":"明代石牌坊（尚书探花 · 三世宰贰）","c":"sight","ll":[24.5085,117.64732],"v":"must","area":"古城","acc":"street","s":"香港路北端“双门顶”，两座万历年间的石牌坊横跨街面，相距约 28 米。国保，随时可看。","d":"<p class=\"judge\"><span class=\"tag-judge\">判断</span>古城里最扎实的东西。牌坊下面就是日常的骑楼街，不是圈起来的景点。</p>"},{"id":"qielan","q":"伽蓝庙","n":"伽蓝庙","c":"sight","ll":[24.50761,117.64731],"v":"opt","area":"古城","acc":"osm","s":"两座牌坊之间、路东二楼的一间“空中小庙”，只有几平方米。抬头看一眼。"},{"id":"hklu","q":"香港路","n":"香港路","c":"walk","ll":[24.5065,117.647],"v":"must","area":"古城","acc":"osm","s":"唐宋以来的中轴线，半游客半住家，还留着竹编之类的老行当。古城里最值得慢走的一条。","d":"<p class=\"fact\"><span class=\"tag-fact\">事实</span>央广网 2026-09-27：古城约 1.7 万老居民，台湾路、香港路等核心街巷老居民留存率超过 85%，居民自营商铺约占三分之二，多为下铺上住。</p>"},{"id":"wenmiao","q":"漳州文庙","n":"漳州文庙","c":"sight","ll":[24.50804,117.64907],"v":"good","area":"古城","acc":"osm","s":"修文西路，国保，大成殿为明成化年间重修。免费。","d":"<p class=\"stale\">开放时间两种说法：9:00–12:00、15:00–19:00（2023 年资料），或全天。按中午有午休准备。</p>"},{"id":"xiuwen","q":"修文西路","n":"修文西路 · 泮池","c":"walk","ll":[24.50779,117.6478],"v":"opt","area":"古城","acc":"osm","s":"现在是“非遗一条街”：印泥、木偶、年画店加戏台，泮池广场有文创市集。偏游客。"},{"id":"bigan","q":"比干庙","n":"比干庙（林氏宗祠）","c":"sight","ll":[24.50916,117.64595],"v":"opt","area":"古城","acc":"osm","s":"国保，只剩中进四方殿和东厢回廊。在安静的小巷里，是否日常开放未能确认。"},{"id":"qingnian","q":"青年路","n":"青年路","c":"walk","ll":[24.51,117.6464],"v":"good","area":"古城西","acc":"osm","s":"古城西北边的本地小吃街：锅边糊、豆花粉丝、麻糍、四果汤都在这条路上。比延安南路日常。"},{"id":"yanan","q":"延安南路","n":"延安南路（主街）","c":"walk","ll":[24.5099,117.64977],"v":"skip","area":"古城","acc":"osm","s":"纯游客商业主街，小吃加旅拍，国庆最挤。只横穿，不逛。","d":"<p class=\"fact\"><span class=\"tag-fact\">事实</span>2024 年国庆古城 7 天约 170 万人次，10 月 2 日单日 33 万；2025 年全年 3730 万人次。官方提示每天 9–17 时是高峰，夜间最热闹。</p>"},{"id":"beikou","q":"中闽百汇","n":"古城北入口（中闽百汇）","c":"walk","ll":[24.51154,117.64971],"v":"skip","area":"古城北","acc":"osm","s":"节假日最堵的入口，2025 年国庆警方曾喊话绕行。不从这里进。"},{"id":"zsq","q":"中山桥","n":"中山桥","c":"nature","ll":[24.50293,117.64578],"v":"must","area":"九龙江","acc":"osm","s":"1920 年代的老桥，现在只走人。步行过九龙江西溪，是这一天最开阔的一段。","d":"<p class=\"stale\">“修缮后作为步行桥重开”的依据是 2018 年的报道，2025–2026 年没有再确认。</p>"},{"id":"nanshansi","q":"南山寺","n":"南山寺","c":"sight","ll":[24.49959,117.64183],"v":"opt","area":"江南岸","acc":"osm","s":"唐代始建的寺院，在江对岸。时间够就走到山门，不够就在桥上折返。","d":"<p class=\"stale\">门票 10 元、8:30–17:00，来自没有日期的票务页，待核实。</p>"},{"id":"nsq","q":"南山桥","n":"南山桥","c":"nature","ll":[24.50337,117.6443],"v":"opt","area":"九龙江","acc":"osm","s":"2011 年建的仿古廊桥，步行。作用是让你不走回头路回到北岸。"},{"id":"ximen","q":"侨村","n":"钟法路 · 侨村（古城西门）","c":"walk","ll":[24.5079,117.6447],"v":"opt","area":"古城西","acc":"osm","s":"古城西缘。侨村据说是本地人下午泡茶的地方，但我没查到具体的茶馆。L1 公交在这里有站。"},{"id":"putou","q":"浦头大庙","n":"浦头大庙","c":"sight","ll":[24.51141,117.67048],"v":"good","area":"浦头港","acc":"osm","s":"古城以东约 2 公里的老港区：居民区、内河、十几座宫庙。比古城主街更像日常。","d":"<p class=\"fact\"><span class=\"tag-fact\">事实</span>福建日报 2025-07：浦头港已“演变为宜居的居民区”，北岸有浦头大庙（关帝）、定潮楼（即文英楼）、霞东书院等 19 座宫庙，河道约 30 米宽、石砌驳岸。</p><p class=\"stale\">旁边的新行街 2026-07-27 起施工半封闭，工期 24 个月，现场可能有围挡。庙宇清晨是否开门未知。</p>"},{"id":"xiadong","q":"霞东书院","n":"霞东书院","c":"sight","ll":[24.51047,117.66802],"v":"opt","area":"浦头港","acc":"osm","s":"浦头港边的文昌宫，从浦头大庙沿港走过来。"},{"id":"southbank","q":"南山桥","n":"南岸桥头","c":"nature","ll":[24.5013,117.6441],"v":"opt","area":"九龙江","acc":"osm","s":"中山桥和南山桥在南岸几乎落在同一处。从这里回头看北岸的古城。"},{"id":"afang","q":"阿芳卤面","n":"阿芳卤面（中闽百汇店）","c":"food","ll":[24.51165,117.65],"v":"good","area":"古城北","acc":"est","s":"最出名的卤面，6:30–24:00，全天排队。稳妥的入门，不是天花板。","d":"<p class=\"fact\"><span class=\"tag-fact\">事实</span>卤面是大骨汤加干贝、鱿鱼、香菇熬成稠卤，浇在另煮的碱面上，浇头自选：炸五香、卤大肠、套肠。人均 15–20 元。</p><p class=\"judge\"><span class=\"tag-judge\">判断</span>排队超过 15 分钟就换隔壁的阿芬卤面（延安北路 3 号）。小碗，别加太多料。</p>"},{"id":"wangji","q":"王记传统卤面","n":"府埕王记传统卤面","c":"food","ll":[24.50935,117.6487],"v":"opt","area":"古城","acc":"est","s":"芳华横路 10 号，开在自家古厝里，8:00–17:00。","d":"<p class=\"stale\">只有 2017 年的来源，现在是否还开未能确认。</p>"},{"id":"qnl","q":"阿君豆花","n":"青年路锅边糊 · 阿君豆花","c":"food","ll":[24.512,117.6466],"v":"must","area":"古城西","acc":"est","s":"青年路 199 号一带，两家挨着。锅边糊 5:00–12:30，豆花粉丝 6:30–18:30。本地早餐。","d":"<p class=\"fact\"><span class=\"tag-fact\">事实</span>漳州的锅边糊汤清，重点是另加的卤料（卤大肠、笋干）和油条；豆花粉丝是咸豆花加粉丝加骨汤。这两样福州都没有对应的吃法。</p><p class=\"stale\">来源是 2020–2024 年的，未能确认现状。位置按门牌估算。</p>"},{"id":"jianguo","q":"建国蚵煎","n":"建国蚵煎蚵面","c":"food","ll":[24.5115,117.6485],"v":"good","area":"古城北","acc":"est","s":"中山公园后门，11:00–23:00。漳州的蚵煎是半煎半炸的酥脆派。11 点开门就去，傍晚爆满。","d":"<p class=\"stale\">新华西路鑫荣花苑二期 28 栋，位置为估算。2026-03、2026-04 有媒体提到。</p>"},{"id":"songshu","q":"松树干拌面","n":"松树干拌面","c":"food","ll":[24.5125,117.6512],"v":"good","area":"古城北","acc":"est","s":"细碱面拌自磨花生酱，配一碗鸭血肉丸汤。10:00–19:00，人均 12–16 元，本地店。","d":"<p class=\"stale\">地址两说：北京路 275-9/10 号，或新华西街南 17 栋 10 号。以地图 App 为准。</p>"},{"id":"laokang","q":"老康面煎粿","n":"老康祖传面煎粿","c":"food","ll":[24.5085,117.6494],"v":"opt","area":"古城","acc":"est","s":"发面厚煎饼，甜口夹花生碎，咸口夹肉和笋丝，3–5 元，下午出炉。","d":"<p class=\"stale\">地址两说（延安南路 159 号 / 新华西南街），位置为估算。</p>"},{"id":"laoguo","q":"老国三角粿","n":"老国三角粿","c":"food","ll":[24.5102,117.6512],"v":"opt","area":"古城","acc":"est","s":"太古桥 8–10 号。米浆加芋头蒸后现炸，蘸甜辣酱。位置在游客动线上，东西是本地的。"},{"id":"aqin","q":"阿琴牛肉","n":"阿琴牛肉","c":"food","ll":[24.5129,117.646],"v":"good","area":"古城西","acc":"est","s":"瑞京路佳苑花园。沙茶汤烫嫩牛肉，约 15 元一份，11:00–23:00。傍晚这一圈的晚饭。"},{"id":"shengtang","q":"松跃生烫","n":"圆圈松跃生烫","c":"food","ll":[24.51202,117.65412],"v":"opt","area":"古城东北","acc":"street","s":"新华北路 2 号，24 小时。猪杂、海鲜现点现汆，清汤。离酒店约 600 米，夜宵就是这里。"},{"id":"heshang","q":"和尚豆干面","n":"公园和尚豆干面","c":"food","ll":[24.5102,117.6472],"v":"opt","area":"古城","acc":"est","s":"手抓面（豆干面份），14:30–19:30，露天吃，排队。","d":"<p class=\"stale\">芳华北路 4 号。2020 年来源，位置为估算。</p>"},{"id":"jike","q":"几克咖啡","n":"几克咖啡","c":"cafe","ll":[24.5108,117.649],"v":"opt","area":"古城北","acc":"est","s":"古城北口，两层，有手冲和书架。国庆必挤。","d":"<p class=\"stale\">新华西南二街 4-8。最新来源是 2024-09。</p>"},{"id":"chachang","q":"漳州茶厂","n":"漳州茶厂（古城店）","c":"cafe","ll":[24.50775,117.6475],"v":"opt","area":"古城","acc":"est","s":"修文路上，“前厂后店”，可以喝一杯本地老拼配乌龙“一枝春”。偏体验和销售，不是久坐的茶馆。"}],"plans":{"a":{"n":"古城·傍晚","intro":"从璞境出发的一圈。下午出门，傍晚在中山桥上看日落，晚饭在古城西边的本地店，天黑后走回酒店。","days":[{"t":"傍晚：古城一圈，在桥上看日落","theme":"璞境 → 台湾路 → 文庙 → 牌坊 → 香港路 → 中山桥 → 南山桥 → 侨村 → 青年路 → 回璞境","steps":[{"t":"16:00","p":"hotel","x":"出门往西。从东边进古城，避开北入口。"},{"t":"16:20","p":"taiwanlu","x":"骑楼街。下午人多，走过去就行，不用停。"},{"t":"16:35","p":"wenmiao","x":"文庙大成殿。闭馆时间我没查到，按 17:00 计，所以先来这里。"},{"t":"16:55","p":"paifang","x":"两座明代石牌坊，抬头找中间二楼的 [[qielan]]。"},{"t":"17:05","p":"hklu","free":true,"x":"沿香港路往南慢慢走到底，没有任务。越往南游客越少。"},{"t":"17:35","p":"zsq","x":"出古城上中山桥。10 月初日落大约 17:50，在桥上等它。"},{"t":"17:55","p":"southbank","x":"走到南岸桥头。南山寺这时已近关门，不去。"},{"t":"18:05","p":"nsq","x":"两座桥在南岸落在同一处，换南山桥走回北岸，不走回头路。"},{"t":"18:20","p":"ximen","x":"沿钟法路往北，经古城西门和侨村。"},{"t":"18:35","p":"bigan","x":"拐进小巷看比干庙外观，天黑了就跳过。"},{"t":"18:45","p":"qingnian","x":"青年路。锅边糊中午就收摊了，这时候只是路过，买一颗现包的麻糍。"},{"t":"19:00","p":"aqin","x":"晚饭：沙茶牛肉加一碗面。"},{"t":"19:45","p":"hotel","x":"沿胜利路往东走回酒店，约 1.4 公里。饿了再去 [[shengtang]]。"}],"note":"全程约 7 km。国庆下午到晚上是古城人最多的时候，所以主街只横穿，时间都花在香港路南段、桥和江边。嫌长就在中山桥上折返，沿香港路回头，少走约 2 km。想要清静的古城，只有早上 7–9 点：把这条线原样搬到早上走，早餐改在 [[qnl]]。","legs":[{"m":"walk","d":1456,"g":[[24.515,117.6594],[24.51445,117.65943],[24.51316,117.65946],[24.51317,117.65925],[24.5131,117.65926],[24.51314,117.65844],[24.51263,117.65843],[24.51257,117.65705],[24.51219,117.65707],[24.51202,117.65412],[24.51163,117.65209],[24.51116,117.65221],[24.511,117.65149],[24.51069,117.65156],[24.50984,117.6516],[24.50856,117.65132],[24.50865,117.65088],[24.50866,117.65026]],"txt":"步行 1.5 km · 约 22 分钟"},{"m":"walk","d":275,"g":[[24.50866,117.65026],[24.50865,117.65088],[24.50871,117.6495],[24.50752,117.64921],[24.50804,117.64907]],"txt":"步行 0.3 km · 约 4 分钟"},{"m":"walk","d":305,"g":[[24.50804,117.64907],[24.50752,117.64921],[24.50772,117.64804],[24.50779,117.64725],[24.50873,117.64734],[24.5085,117.64732]],"txt":"步行 0.3 km · 约 5 分钟"},{"m":"walk","d":281,"g":[[24.5085,117.64732],[24.50873,117.64734],[24.50622,117.64707],[24.5065,117.647]],"txt":"步行 0.3 km · 约 4 分钟"},{"m":"walk","d":938,"g":[[24.5065,117.647],[24.50622,117.64707],[24.50589,117.64701],[24.50575,117.64692],[24.50586,117.6467],[24.50698,117.64509],[24.5071,117.64473],[24.5053,117.64454],[24.50523,117.64471],[24.50497,117.64507],[24.50492,117.64528],[24.50477,117.64547],[24.50466,117.64638],[24.50459,117.64655],[24.50384,117.64639],[24.50304,117.64588],[24.50293,117.64578]],"txt":"步行 0.9 km · 约 14 分钟"},{"m":"walk","d":275,"g":[[24.50293,117.64578],[24.50304,117.64588],[24.50179,117.64457],[24.50127,117.64419],[24.50134,117.64408],[24.5013,117.6441]],"txt":"步行 0.3 km · 约 4 分钟"},{"m":"walk","d":186,"g":[[24.5013,117.6441],[24.50134,117.64408],[24.50127,117.64419],[24.50179,117.64457],[24.50245,117.64527],[24.50337,117.6443]],"txt":"步行 0.2 km · 约 3 分钟"},{"m":"walk","d":802,"g":[[24.50337,117.6443],[24.50245,117.64527],[24.50304,117.64588],[24.50351,117.6462],[24.50402,117.64646],[24.50459,117.64655],[24.50466,117.64638],[24.50477,117.64547],[24.50492,117.64528],[24.50497,117.64507],[24.50523,117.64471],[24.5053,117.64454],[24.5056,117.6445],[24.50797,117.64474],[24.5079,117.6447]],"txt":"步行 0.8 km · 约 12 分钟"},{"m":"walk","d":341,"g":[[24.5079,117.6447],[24.50797,117.64474],[24.50961,117.64487],[24.50943,117.64642],[24.50916,117.64595]],"txt":"步行 0.3 km · 约 5 分钟"},{"m":"walk","d":0,"g":[[24.50916,117.64595],[24.50943,117.64642],[24.51,117.6464]],"txt":"步行 0.0 km · 约 1 分钟"},{"m":"walk","d":639,"g":[[24.51,117.6464],[24.50943,117.64642],[24.51127,117.64671],[24.51233,117.6467],[24.51241,117.64524],[24.51301,117.64535],[24.51294,117.64632],[24.5129,117.646]],"txt":"步行 0.6 km · 约 10 分钟"},{"m":"walk","d":1716,"g":[[24.5129,117.646],[24.51294,117.64632],[24.51301,117.64535],[24.51355,117.64532],[24.51337,117.65009],[24.51329,117.65345],[24.51329,117.65419],[24.51335,117.65418],[24.51327,117.65607],[24.51331,117.65615],[24.51438,117.65613],[24.51453,117.65737],[24.51445,117.65943],[24.515,117.6594]],"txt":"步行 1.7 km · 约 26 分钟"}],"appleGroups":[{"n":"璞境·HOTEL民宿 → 比干庙","ids":["hotel","taiwanlu","wenmiao","paifang","hklu","zsq","southbank","nsq","ximen","bigan"],"mode":"walking"},{"n":"比干庙 → 璞境·HOTEL民宿","ids":["bigan","qingnian","aqin","hotel"],"mode":"walking"}]}]},"b":{"n":"浦头港","intro":"璞境在古城和浦头港中间，浦头港走路 15–20 分钟就到。1.5 小时的短线，适合提车前的早上。","days":[{"t":"浦头港：从璞境走过去","theme":"璞境 → 浦头大庙 → 霞东书院 → 回璞境","steps":[{"t":"08:00","p":"hotel","x":"出门往东，穿过九龙公园一带。"},{"t":"08:20","p":"putou","x":"关帝庙和旁边的定潮楼（文英楼）古码头。"},{"t":"08:45","p":"xiadong","free":true,"x":"沿港走到霞东书院，周围的盐鱼市、笼仔街随便转。"},{"t":"09:30","p":"hotel","x":"走回酒店。"}],"note":"这条不挑时间，早上或下午都行，来回约 3 km。它是居民区加老港口，比古城主街日常。新行街在施工，如果到了发现都是围挡，就原路回来。","legs":[{"m":"walk","d":1569,"g":[[24.515,117.6594],[24.51445,117.65943],[24.51316,117.65946],[24.5131,117.65973],[24.51303,117.65973],[24.51307,117.66051],[24.51233,117.66057],[24.51238,117.66123],[24.51235,117.66242],[24.51186,117.66268],[24.51178,117.66277],[24.51107,117.66672],[24.51105,117.6671],[24.50939,117.66704],[24.50938,117.66818],[24.50957,117.66826],[24.51055,117.6694],[24.51071,117.66949],[24.51079,117.66966],[24.51141,117.67048]],"txt":"步行 1.6 km · 约 24 分钟"},{"m":"walk","d":508,"g":[[24.51141,117.67048],[24.51079,117.66966],[24.51071,117.66949],[24.51055,117.6694],[24.50957,117.66826],[24.50938,117.66818],[24.50936,117.6673],[24.50938,117.66714],[24.51094,117.66721],[24.51094,117.66729],[24.51047,117.66802]],"txt":"步行 0.5 km · 约 8 分钟"},{"m":"walk","d":1078,"g":[[24.51047,117.66802],[24.51094,117.66729],[24.51095,117.6671],[24.51105,117.6671],[24.51107,117.66672],[24.51178,117.66277],[24.51186,117.66268],[24.51235,117.66242],[24.51238,117.66123],[24.51233,117.66057],[24.51307,117.66051],[24.51303,117.65973],[24.5131,117.65973],[24.51316,117.65946],[24.51445,117.65943],[24.515,117.6594]],"txt":"步行 1.1 km · 约 16 分钟"}],"appleGroups":[{"n":"璞境·HOTEL民宿 → 璞境·HOTEL民宿","ids":["hotel","putou","xiadong","hotel"],"mode":"walking"}]}]}},"sections":{"intro":"\n<div class=\"eyebrow\">2026-10-04 更新 · 驻地改为璞境</div>\n<h2>总体判断：漳州怎么过</h2>\n<p class=\"lede\">把漳州古城当成“还不错、不惊艳”来安排：走一圈就够。它的好处是真有人住，不是布景；坏处是国庆白天和晚上主街人挤人。</p>\n<ol>\n<li><b>驻地是璞境（元光南路，九龙公园旁）。</b>它在古城和浦头港中间，往西 1 公里是古城，往东 1.2 公里是浦头港，两边都能走到。</li>\n<li><b>古城走一圈。</b>只有三样东西够得上“值得”：香港路的两座明代石牌坊、文庙大成殿、香港路和台湾路的骑楼街。再加一段步行过江。“路线”页给的是傍晚版，日落时在中山桥上。</li>\n<li><b>浦头港是短线。</b>来回 3 公里，1.5 小时，适合提车前的早上。</li>\n<li><b>吃在古城外圈。</b>晚饭去古城西边和北边的本地店，不进主街。</li>\n</ol>\n<p class=\"judge\"><span class=\"tag-judge\">判断</span>最可能让人满意的是香港路南段和步行过中山桥；最可能让人失望的是延安南路主街和任何“国庆活动”。</p>\n<p class=\"fact\"><span class=\"tag-fact\">事实</span>2025 年古城全年客流 3730 万人次，有 844 家商户；2024 年国庆 7 天约 170 万人次，单日最高 33 万。没有查到今年限流或预约的公告。</p>\n<p class=\"note\">判断都按保守写。资料来自网上检索，没有实地核验；官方和媒体稿普遍偏正面。</p>\n<p class=\"note\">客观事实、网上评价和我的判断分别用 <span class=\"tag-fact\">事实</span><span class=\"tag-web\">网上评价</span><span class=\"tag-judge\">判断</span> 标出。<span class=\"stale\">黄色文字</span> 是没能确认现状的信息。</p>\n","areas":"<h2>走哪里</h2><div class=\"card\"><h3>香港路（含两座石牌坊） <span class=\"chip v-must\">必去</span></h3><p>古城的中轴线。北端“双门顶”是两座明万历年间的石牌坊，中间二楼藏着一间几平方米的伽蓝庙。往南越走越像住家街，还有竹编之类的老行当。</p><p class=\"judge\"><span class=\"tag-judge\">判断</span>古城里只走一条街的话，走这条。8–10 点最好。</p><p class=\"note\"><a href=\"#\" data-go=\"24.5072,117.6472,17\">在地图上看</a></p></div><div class=\"card\"><h3>中山桥 · 九龙江 <span class=\"chip v-must\">必去</span></h3><p>1920 年代的老桥，现在只走人。过江以后可以到南山寺，再从仿古的南山桥回北岸，不走回头路。</p><p class=\"judge\"><span class=\"tag-judge\">判断</span>这是这一天里最开阔、最不像景区的一段。</p><p class=\"note\"><a href=\"#\" data-go=\"24.5029,117.6458,17\">在地图上看</a></p></div><div class=\"card\"><h3>文庙 · 修文西路 <span class=\"chip v-good\">值得</span></h3><p>文庙大成殿是明成化年间重修的，国保，免费。门口的修文西路现在是“非遗一条街”，偏游客。</p><p class=\"note\"><a href=\"#\" data-go=\"24.508,117.6485,17\">在地图上看</a></p></div><div class=\"card\"><h3>台湾路 <span class=\"chip v-good\">值得</span></h3><p>骑楼老店街。来源对它的商业化程度说法不一，我的判断是仍有住家，但已经不安静。早上去。</p><p class=\"note\"><a href=\"#\" data-go=\"24.5087,117.65,17\">在地图上看</a></p></div><div class=\"card\"><h3>青年路 <span class=\"chip v-good\">值得</span></h3><p>古城西北边，本地小吃集中：锅边糊、豆花粉丝、麻糍。比延安南路日常得多。</p><p class=\"note\"><a href=\"#\" data-go=\"24.51,117.6464,17\">在地图上看</a></p></div><div class=\"card\"><h3>浦头港 <span class=\"chip v-good\">值得</span></h3><p>古城以东约 2 公里，离璞境约 1.2 公里，走路可到。居民区、石砌驳岸的内河、十几座宫庙。资料说它已经是“宜居的居民区”，没有查到拆迁。</p><p class=\"stale\">旁边的新行街从 2026-07-27 起施工，半封闭。现场观感未知，所以当备选。</p><p class=\"note\"><a href=\"#\" data-go=\"24.511,117.6695,17\">在地图上看</a></p></div><div class=\"card\"><h3>中山公园 · 府埕 <span class=\"chip v-opt\">看时间</span></h3><p>公园是 1990 年代翻建的，十几分钟穿完，只当通道。府埕是原府衙前的小广场，周边偏游客。</p><p class=\"note\"><a href=\"#\" data-go=\"24.51,117.6486,17\">在地图上看</a></p></div><div class=\"card\"><h3>延安南路 · 太古桥 · 北入口 <span class=\"chip v-skip\">可删</span></h3><p>纯游客商业：小吃、旅拍、新开的集装箱街。国庆全天缓行。只横穿，不逛，也不从北入口进。</p><p class=\"note\"><a href=\"#\" data-go=\"24.5105,117.65,17\">在地图上看</a></p></div>","food":"\n<h2>漳州怎么吃</h2>\n<p class=\"lede\">漳州没有榜单餐厅：米其林和黑珍珠的福建榜都没有收录漳州。吃的是街坊小店，强项是早餐和小吃，不是正餐。</p>\n<h3>和福州有什么不一样</h3>\n<p>福州是“汤”的逻辑：虾油、红糟、鱼丸肉燕，清鲜带酸甜。漳州是“卤、酱、炸、碱面”的逻辑：一锅勾芡的卤汤，配一柜子卤料任选；蘸酱很重，花生酱、沙茶、甜辣酱、蒜蓉醋；米浆做的东西多；口味偏甜，往南已经有潮汕的影子。</p>\n<h3>要吃懂的几样</h3>\n<ul>\n<li><b>卤面：</b>大骨汤加干贝、鱿鱼、香菇熬成稠卤，浇在另煮的碱面上，浇头自选（炸五香、卤大肠、套肠）。</li>\n<li><b>豆花粉丝：</b>咸豆花加粉丝加骨汤，再加卤料和油条。早餐。</li>\n<li><b>锅边糊：</b>和福州同源，但漳州的汤清，重点在另加的卤料。</li>\n<li><b>手抓面（豆干面份）：</b>碱面压成饼切块，配炸豆干、五香，淋花生酱和芥辣。下午点心。</li>\n<li><b>干拌面：</b>细碱面拌自磨花生酱，旁边一碗鸭血肉丸汤。</li>\n<li><b>面煎粿：</b>发面厚煎饼，甜口或咸口。</li>\n<li><b>生烫 · 沙茶牛肉：</b>猪杂、海鲜或牛肉现点现汆。漳州自己的牛肉吃法是这个，不是潮汕牛肉火锅。</li>\n</ul>\n<h3>一天怎么吃</h3>\n<div class=\"tw\"><table>\n<tr><th>早餐</th><td>[[qnl]]（两样各一碗），或者 [[afang]]</td></tr>\n<tr><th>上午路上</th><td>[[laokang]]；青年路现包的麻糍</td></tr>\n<tr><th>午饭</th><td>[[aqin]]，或者 11 点开门就去 [[jianguo]]</td></tr>\n<tr><th>下午点心</th><td>[[heshang]]（14:30 开）、[[laoguo]]</td></tr>\n<tr><th>晚饭</th><td>[[songshu]]，或阿琴牛肉加一盘卤味。想正式坐下吃，选择很少，而且都没能确认现状</td></tr>\n<tr><th>夜宵</th><td>[[shengtang]]（24 小时）</td></tr>\n</table></div>\n<h3>可以不追的</h3>\n<ul>\n<li>四果汤：十月已经不是季节，厦门泉州也有。</li>\n<li>清叶鸡蛋汉堡、九根鸡腿：典型的游客长队。</li>\n<li>猫仔粥：其实是诏安的东西，市区没有靠谱的店。</li>\n<li>“片仔癀”饮品：用的是一种叫白凤菜的青草，和中成药片仔癀没有关系，名字是营销。尝一杯就够。</li>\n<li>潮汕牛肉火锅：连锁店，不是漳州特色。</li>\n</ul>\n<p class=\"fact\"><span class=\"tag-fact\">事实</span>2025 年 5 月漳州有一家锅边糊店因在卤料里加复方甘草片被查处关停，通报没有点名店铺。</p>\n<p class=\"stale\">多数小店只找到 2020–2024 年的来源，可能已经搬迁或歇业。网上流传的几个店名（阿达卤面、明姑手抓面、澎湖湾四果汤等）检索不到；网上还有 AI 生成的假攻略，这里都没有采用。出发前在地图 App 里逐家看一眼。</p>\n<p class=\"note\">排队超过 15 分钟就放弃，不亏。</p>\n","cafe":"\n<h2>咖啡和茶</h2>\n<p class=\"lede\">国庆期间古城里没有安静的咖啡馆。能坐一两个小时的在古城外的社区店，需要骑车或打车。想安静坐下来工作，酒店房间可能就是最好的“咖啡馆”。</p>\n<h3>古城外，适合久坐</h3>\n<ul>\n<li><b>公园小说 TERROIR project：</b>新浦花园 3 号楼 107-1。社区一楼，落地窗，书和老物件，描述是安静、适合看书。2026-03 有媒体提到。</li>\n<li><b>糖仓 Bonbon Town：</b>岱山路 6-2 号一号仓库，原糖厂的 500㎡ 老仓库，咖啡加展览。2026-07 有报道。营业时间待核实。</li>\n</ul>\n<p class=\"stale\">这两家我没能在底图上定位，地图上没有标点，请在地图 App 里搜店名。“安静”都是非国庆时段的描述。</p>\n<h3>古城里，歇脚用</h3>\n<div>[[jike]] · [[chachang]]</div>\n<p class=\"note\">修文东路还有“茶之序”（内有功夫茶馆，游客向）；侨芗剧场对面有露天的工夫茶摊。古城里刷到的旅拍风咖啡店多半是拍照店。</p>\n","cut":"\n<h2>可以删掉的</h2>\n<div class=\"tw\"><table>\n<tr><th>地方</th><th>处理</th><th>原因</th></tr>\n<tr><td>延安南路主街、太古桥小吃街</td><td>只横穿</td><td>纯游客商业，国庆人挤人</td></tr>\n<tr><td>归来街、月港风情街</td><td>不去</td><td>2026 年新开的集装箱商业街</td></tr>\n<tr><td>《再回闽南》沉浸演出</td><td>不去</td><td>198 元起，网红向</td></tr>\n<tr><td>夜间巡游、街头情景秀</td><td>不去</td><td>人最多的时段，今年的场次也没查到</td></tr>\n<tr><td>威镇阁</td><td>不去</td><td>1990 年代重建，形制和原楼不符，还要绕路</td></tr>\n<tr><td>中山公园</td><td>当通道</td><td>翻建过的普通公园</td></tr>\n<tr><td>古城记忆馆、片仔癀博物馆等小馆</td><td>可不进</td><td>官方打卡点</td></tr>\n<tr><td>临时省委旧址</td><td>不去</td><td>需要提前一天电话预约</td></tr>\n<tr><td>南山文化生态园、芝山公园</td><td>不去</td><td>新造或普通的公园</td></tr>\n<tr><td>木偶艺术表演馆</td><td>看兴趣</td><td>68 元，要提前订票，场次不固定。真想看非遗，它比街头秀靠谱</td></tr>\n</table></div>\n","src":"<h2>资料来源</h2><p class=\"note\">查询日期 2026-10-01。大众点评、小红书、高德详情页都抓不到，多数小店的现状没能确认。</p><ul><li><a href=\"https://www.cnr.cn/fj/gstjfj/20260927/t20260927_527826499.shtml\" target=\"_blank\" rel=\"noopener\">央广网：漳州古城的居民与街巷（2026-09-27）</a></li><li><a href=\"https://www.news.cn/local/20260419/4a0dcf9f0f51490989c5e9ffe450abcf/c.html\" target=\"_blank\" rel=\"noopener\">新华网：漳州古城（2026-04-19）</a></li><li><a href=\"https://www.fjdaily.com/app/content/2021-07/21/content_1082947.html\" target=\"_blank\" rel=\"noopener\">福建日报：古城范围（2021-07）</a></li><li><a href=\"https://www.fujian.gov.cn/zwgk/ztzl/sxzygwzxsgzx/sdjj/wvjj/202507/t20250704_6961530.htm\" target=\"_blank\" rel=\"noopener\">福建日报：浦头港（2025-07-04）</a></li><li><a href=\"https://zzpd.fjsen.com/2026-07/28/content_32224741.htm\" target=\"_blank\" rel=\"noopener\">东南网：新行街施工（2026-07-28）</a></li><li><a href=\"https://www.sohu.com/a/1081840471_121106994\" target=\"_blank\" rel=\"noopener\">漳州官方号：2026 国庆“古城超有戏”活动（2026-09-28）</a></li><li><a href=\"https://www.zhangzhou.gov.cn/cms/html/zzsrmzf/2024-10-03/1581745928.html\" target=\"_blank\" rel=\"noopener\">漳州市政府：2024 国庆古城客流</a></li><li><a href=\"https://view.inews.qq.com/a/20260316A06N6000\" target=\"_blank\" rel=\"noopener\">TimeOut 北京：漳州吃喝（2026-03-16）</a></li><li><a href=\"https://news.qq.com/rain/a/20260414A075FH00\" target=\"_blank\" rel=\"noopener\">腾讯新闻：漳州小吃店（2026-04-14）</a></li><li><a href=\"https://m.thepaper.cn/newsDetail_forward_23992398\" target=\"_blank\" rel=\"noopener\">福桃九分饱：漳州（2023-07）</a></li><li><a href=\"https://www.michelin.com.cn/news/2025/1121.html\" target=\"_blank\" rel=\"noopener\">米其林 2026 福建榜（2025-11-21，未收录漳州）</a></li><li><a href=\"https://finance.sina.com.cn/wm/2025-04-10/doc-inessueq3055997.shtml\" target=\"_blank\" rel=\"noopener\">新浪财经：“片仔癀草”是什么（2025-04）</a></li><li><a href=\"https://www.163.com/dy/article/K7QTCCK70514BSFO.html\" target=\"_blank\" rel=\"noopener\">锅边糊店违规添加案（2025）</a></li><li><a href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\">OpenStreetMap（底图、路网、步行路线计算）</a></li><li><a href=\"https://kyfw.12306.cn/\" target=\"_blank\" rel=\"noopener\">12306（车次与余票，2026-10-01 查询）</a></li></ul>","tool":"\n<h2>怎么用这张图</h2>\n<ul>\n<li>底图用 OpenStreetMap 数据自己画的。放大后显示街巷名。</li>\n<li>“路线”页选“古城·傍晚”或“浦头港”，地图上的红线是在路网上算出的步行路径，点线是打车。</li>\n<li>点圆点看这个地点的判断；每个地点都能一键在苹果地图或高德里打开。</li>\n<li>位置精度：“osm”是 OSM 里的真实对象；“street”是按路名放的；“est”是估算，去之前先在地图 App 里搜名字。<b>吃的那几家大多是估算位置，璞境的位置也是按门牌放的。</b></li>\n<li>右上角“定位”显示你的实时位置；“高德/卫星”可以换成在线底图。</li>\n</ul>\n"},"areaLabels":[{"n":"古城","ll":[24.5083,117.6462],"minz":13,"maxz":16.5},{"n":"九龙江","ll":[24.5022,117.65],"minz":13,"maxz":16},{"n":"浦头港","ll":[24.5122,117.669],"minz":13,"maxz":16},{"n":"九龙公园","ll":[24.515,117.6612],"minz":14,"maxz":16.5}]};
</script>
<script>
(function(){
"use strict";
const T=window.TRIP, B=window.BASE;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('zz.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('zz.'+k,JSON.stringify(v))}catch(e){}}};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- theme ---------- */
const themes=['auto','light','dark'];let theme=store.get('theme','auto');
function applyTheme(){if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);$('#themeBtn').textContent={auto:'◐',light:'☀',dark:'☾'}[theme];if(window._redrawBase)window._redrawBase()}
$('#themeBtn').onclick=()=>{theme=themes[(themes.indexOf(theme)+1)%3];store.set('theme',theme);applyTheme()};
applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>window._redrawBase&&window._redrawBase())}catch(e){}

/* ---------- coordinate helpers ---------- */
function outOfChina(lat,lng){return lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271}
function tLat(x,y){let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;return r}
function tLng(x,y){let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;return r}
function wgs2gcj(lat,lng){if(outOfChina(lat,lng))return[lat,lng];const a=6378245,ee=.00669342162296594323;let dLat=tLat(lng-105,lat-35),dLng=tLng(lng-105,lat-35);const rl=lat/180*Math.PI;let m=Math.sin(rl);m=1-ee*m*m;const sm=Math.sqrt(m);dLat=dLat*180/((a*(1-ee))/(m*sm)*Math.PI);dLng=dLng*180/(a/sm*Math.cos(rl)*Math.PI);return[lat+dLat,lng+dLng]}
const CITY='漳州';
let appleSys=store.get('appleSys','wgs');
function fmt(n){return n.toFixed(6)}
function forApple(ll){return appleSys==='gcj'?wgs2gcj(ll[0],ll[1]):ll}
function appleLink(p){const ll=forApple(p.ll);return 'https://maps.apple.com/?ll='+fmt(ll[0])+','+fmt(ll[1])+'&q='+encodeURIComponent(p.q||p.n)}
function isBiz(p){return p.acc!=='osm'||p.c==='food'||p.c==='cafe'||p.c==='stay'}
function appleSearch(p){const ll=forApple(p.ll);return 'https://maps.apple.com/?q='+encodeURIComponent((p.q||p.n)+' '+CITY)+'&sll='+fmt(ll[0])+','+fmt(ll[1])+'&z=17'}
function amapSearch(p){return 'https://uri.amap.com/search?keyword='+encodeURIComponent(p.q||p.n)+'&city='+encodeURIComponent(CITY)+'&callnative=1'}
function appleWalk(p){const ll=forApple(p.ll);return 'https://maps.apple.com/directions?destination='+fmt(ll[0])+','+fmt(ll[1])+'&mode=walking'}
function appleMulti(pts,mode){if(pts.length<2)return null;const f=p=>{const ll=forApple(p.ll);return fmt(ll[0])+','+fmt(ll[1])};let u='https://maps.apple.com/directions?source='+f(pts[0]);for(const p of pts.slice(1,-1))u+='&waypoint='+f(p);return u+'&destination='+f(pts[pts.length-1])+'&mode='+(mode||'walking')}
function amapLink(p){return 'https://uri.amap.com/marker?position='+fmt(p.ll[1])+','+fmt(p.ll[0])+'&name='+encodeURIComponent(p.q||p.n)+'&coordinate=wgs84&callnative=1'}

/* ---------- decode base map ---------- */
const OX=B.o[0],OY=B.o[1],Q=B.q;
const P0=(lat,lng)=>{const x=(lng+180)/360*256;const s=Math.sin(lat*Math.PI/180);const y=(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256;return[x,y]};
function dec(arr){const n=arr.length/2;const out=new Float64Array(arr.length);let x=0,y=0,minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;for(let i=0;i<n;i++){x+=arr[2*i];y+=arr[2*i+1];const p=P0(OY+y/Q,OX+x/Q);out[2*i]=p[0];out[2*i+1]=p[1];if(p[0]<minx)minx=p[0];if(p[0]>maxx)maxx=p[0];if(p[1]<miny)miny=p[1];if(p[1]>maxy)maxy=p[1]}return{c:out,b:[minx,miny,maxx,maxy]}}
const F={roads:B.roads.map(r=>Object.assign(dec(r[3]),{lv:r[0],nm:r[1],br:r[2]})),water:B.water.map(dec),wl:B.wl.map(r=>Object.assign(dec(r[2]),{k:r[0],nm:r[1]})),green:B.green.map(g=>Object.assign(dec(g[1]),{k:g[0]})),b:B.b.map(dec),rail:B.rail.map(dec),holes:(B.holes||[]).map(dec),
  metro:B.metro.map(m=>({ref:m[0],col:m[1],segs:m[2].map(dec)})),st:B.st.map(s=>{const p=P0(OY+s[2]/Q,OX+s[1]/Q);return{n:s[0],x:p[0],y:p[1]}})};
F.roads.sort((a,b)=>b.lv-a.lv);

/* ---------- map ---------- */
const map=L.map('map',{zoomControl:false,attributionControl:true,minZoom:11,maxZoom:19,zoomSnap:0.5,wheelPxPerZoomLevel:90,maxBounds:[[24.40,117.52],[24.62,117.78]]});
map.attributionControl.setPrefix(false);window._map=map;
map.attributionControl.addAttribution('底图数据 © OpenStreetMap 贡献者（2026 年快照）');
map.createPane('base');map.getPane('base').style.zIndex=150;
map.createPane('tiles');map.getPane('tiles').style.zIndex=160;
const initial=store.get('view',null);
if(initial)map.setView(initial.c,initial.z);else map.fitBounds([[24.498,117.638],[24.520,117.673]]);
map.on('moveend',()=>{const c=map.getCenter();store.set('view',{c:[c.lat,c.lng],z:map.getZoom()});updScale();updLabels()});

const renderer=L.canvas({pane:'base',padding:0.4}).addTo(map);
function colors(){return{land:css('--land'),block:css('--block'),green:css('--green'),green2:css('--green-2'),water:css('--water'),wline:css('--water-line'),road:css('--road'),rcase:css('--road-case'),rmaj:css('--road-major'),rmajc:css('--road-major-case'),path:css('--path'),rail:css('--rail'),label:css('--label'),halo:css('--label-halo'),lw:css('--label-water'),ink:css('--ink')}}
const LW=[24,20,15,11,7,4.5,2.4,2.4];
const LMIN=[{z:11,w:1.6},{z:11,w:1.3},{z:12,w:1},{z:13,w:.8},{z:14,w:.7},{z:15.5,w:.6},{z:15,w:.8},{z:15.5,w:.8}];
function draw(){
  if(!renderer._ctx||!renderer._bounds)return;
  if(baseMode!=='draw'){const ctx=renderer._ctx,b=renderer._bounds;ctx.clearRect(b.min.x,b.min.y,b.max.x-b.min.x,b.max.y-b.min.y);return}
  const ctx=renderer._ctx,b=renderer._bounds,z=map.getZoom(),k=Math.pow(2,z),po=map.getPixelOrigin();
  const C=colors();
  const vx0=(b.min.x+po.x)/k,vy0=(b.min.y+po.y)/k,vx1=(b.max.x+po.x)/k,vy1=(b.max.y+po.y)/k;
  const vis=f=>!(f.b[2]<vx0||f.b[0]>vx1||f.b[3]<vy0||f.b[1]>vy1);
  const path=(f,close)=>{const c=f.c;ctx.moveTo(c[0]*k-po.x,c[1]*k-po.y);for(let i=2;i<c.length;i+=2)ctx.lineTo(c[i]*k-po.x,c[i+1]*k-po.y);if(close)ctx.closePath()};
  ctx.fillStyle=C.land;ctx.fillRect(b.min.x,b.min.y,b.max.x-b.min.x,b.max.y-b.min.y);
  const mpp=k*256/(40075016*Math.cos(24.51*Math.PI/180))/256*1; // px per meter
  const pxm=Math.pow(2,z)*256/(40075016*0.9099);
  // green
  for(const g of F.green){if(!vis(g))continue;ctx.beginPath();path(g,true);ctx.fillStyle=g.k===0?C.green:C.green2;ctx.fill()}
  // water polygons
  ctx.fillStyle=C.water;ctx.beginPath();for(const w of F.water){if(vis(w))path(w,true)}for(const w of F.holes){if(vis(w))path(w,true)}ctx.fill('evenodd');
  // waterway lines
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=C.water;
  for(const w of F.wl){if(!vis(w))continue;const wd=w.k===0?Math.max(2,14*pxm):w.k===1?Math.max(1.5,9*pxm):Math.max(1,5*pxm);if(w.k===2&&z<13.5)continue;ctx.lineWidth=wd;ctx.beginPath();path(w);ctx.stroke()}
  // buildings
  if(z>=15){ctx.fillStyle=C.block;ctx.beginPath();for(const f of F.b){if(vis(f))path(f,true)}ctx.fill()}
  // roads: casing pass then fill pass, minor first
  const widths=F.roads.map(r=>{const m=LMIN[r.lv];if(z<m.z)return 0;return Math.max(m.w,LW[r.lv]*pxm)});
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<F.roads.length;i++){const r=F.roads[i],w=widths[i];if(!w||!vis(r))continue;
      if(r.lv>=6){if(pass===0)continue;ctx.setLineDash(r.lv===7?[1.5,2]:(z>=16?[4,3]:[]));ctx.strokeStyle=C.path;ctx.lineWidth=Math.max(.8,Math.min(w,2.2));ctx.beginPath();path(r);ctx.stroke();ctx.setLineDash([]);continue}

      if(pass===0){if(w<1.6)continue;ctx.strokeStyle=major?C.rmajc:C.rcase;ctx.lineWidth=w+(z>=15?2:1.2);}
      else{ctx.strokeStyle=major?C.rmaj:C.road;ctx.lineWidth=w;if(w<1.6)ctx.strokeStyle=major?C.rmajc:C.rcase}

  }

  // metro

function labels(ctx,b,z,k,po,C,vis){

  const nameSeen=new Map();
  ctx.textBaseline='middle';ctx.textAlign='center';ctx.lineJoin='round';
  // area labels
  ctx.font='600 '+(z>=15?17:14)+'px '+css('--f-display');
  for(const a of (T.areaLabels||[])){if(z<a.minz||z>a.maxz)continue;const p=P0(a.ll[0],a.ll[1]);const x=p[0]*k-po.x,y=p[1]*k-po.y;const w=ctx.measureText(a.n).width;const r=[x-w/2-4,y-12,x+w/2+4,y+12];placed.push(r);ctx.strokeStyle=C.halo;ctx.lineWidth=4;ctx.strokeText(a.n,x,y);ctx.fillStyle=C.lw==='x'?C.ink:css('--zao');ctx.fillText(a.n,x,y)}
  // metro station names
  if(z>=14){ctx.font='600 11.5px '+css('--f-body');for(const s of F.st){const x=s.x*k-po.x,y=s.y*k-po.y;if(x<b.min.x||x>b.max.x||y<b.min.y||y>b.max.y)continue;const t='Ⓜ '+s.n.replace(/站$/,'');const w=ctx.measureText(t).width;const r=[x+7,y-8,x+9+w,y+8];if(hit(r))continue;placed.push(r);ctx.textAlign='left';ctx.strokeStyle=C.halo;ctx.lineWidth=3.5;ctx.strokeText(t,x+8,y);ctx.fillStyle=C.ink;ctx.fillText(t,x+8,y);ctx.textAlign='center'}}
  // road & water names
  const minLv=z>=16.5?7:z>=15.5?6:z>=15?4:z>=14?3:z>=13?1:-1;
  if(minLv<0)return;
  const fs=z>=16?12.5:11.5;ctx.font=fs+'px '+css('--f-body');
  const cands=[];
  for(const r of F.roads){if(r.nm<0||r.lv>minLv||!vis(r))continue;cands.push([r,r.lv,0])}
  if(z>=13.5)for(const w of F.wl){if(w.nm<0||!vis(w))continue;cands.push([w,-1,1])}
  cands.sort((a,b)=>a[1]-b[1]);

    const name=B.names[f.nm];const c=f.c;
    // longest on-screen segment
    let best=-1,bl=0;for(let i=0;i<c.length-2;i+=2){const x1=c[i]*k-po.x,y1=c[i+1]*k-po.y,x2=c[i+2]*k-po.x,y2=c[i+3]*k-po.y;const L=Math.hypot(x2-x1,y2-y1);if(L>bl){const mx=(x1+x2)/2,my=(y1+y2)/2;if(mx<b.min.x||mx>b.max.x||my<b.min.y||my>b.max.y)continue;bl=L;best=i}}
    if(best<0)continue;
    const n=[...name].length;const need=n*fs*1.02+8;if(bl<need)continue;
    const x1=c[best]*k-po.x,y1=c[best+1]*k-po.y,x2=c[best+2]*k-po.x,y2=c[best+3]*k-po.y;
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    const prev=nameSeen.get(name);if(prev&&prev.some(q=>Math.hypot(q[0]-mx,q[1]-my)<(z>=16?260:340)))continue;
    let ang=Math.atan2(y2-y1,x2-x1);if(ang>Math.PI/2)ang-=Math.PI;if(ang<-Math.PI/2)ang+=Math.PI;
    const vertical=Math.abs(ang)>1.0;

    if(vertical)r=[mx-fs*0.7,my-ext,mx+fs*0.7,my+ext];else{const hw=Math.abs(Math.cos(ang))*ext+Math.abs(Math.sin(ang))*fs*0.7,hh=Math.abs(Math.sin(ang))*ext+Math.abs(Math.cos(ang))*fs*0.7;r=[mx-hw,my-hh,mx+hw,my+hh]}
    if(hit(r))continue;placed.push(r);
    if(!prev)nameSeen.set(name,[[mx,my]]);else prev.push([mx,my]);
    ctx.fillStyle=isW?C.lw:C.label;ctx.strokeStyle=C.halo;ctx.lineWidth=3;
    if(vertical){const chars=[...name];const sy=my-(chars.length-1)*fs*0.55;chars.forEach((ch,i)=>{const yy=sy+i*fs*1.1;ctx.strokeText(ch,mx,yy);ctx.fillText(ch,mx,yy)})}

  }
}

  h+='<p class="note k">'+p.ll[0].toFixed(5)+', '+p.ll[1].toFixed(5)+(p.acc?' · 位置精度：'+esc(p.acc):'')+'</p>';
  if(p.src)h+='<p class="note">来源：'+p.src+'</p>';
  el.innerHTML=linkify(h);el.scrollTop=0;bindContent(el);
  $('#backBtn').onclick=e=>{e.preventDefault();selId=null;drawMarkers();setTab(returnTab||'list')};
  const cb=$('#copyBtn');if(cb)cb.onclick=async()=>{const t=p.q||p.n;let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e2){}}cb.textContent=ok?'✓ 已复制':t};
  $('#doneBtn').onclick=()=>{if(done.has(id))done.delete(id);else done.add(id);store.set('done',[...done]);openPoi(id,false)};
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected','false'));
  drawMarkers();if(fly)map.setView(p.ll,Math.max(map.getZoom(),16));sheet('mid')}

/* ---------- bottom sheet ---------- */
const panel=$('#panel');let sheetState=store.get('sheet','mid');
function sheet(s){if(s)sheetState=s;panel.classList.toggle('s-min',sheetState==='min');panel.classList.toggle('s-max',sheetState==='max');store.set('sheet',sheetState);setTimeout(()=>map.invalidateSize(),300)}
$('#handle').onclick=()=>sheet({min:'mid',mid:'max',max:'min'}[sheetState]);
let ty=null;$('#handle').addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
$('#handle').addEventListener('touchend',e=>{if(ty==null)return;const dy=e.changedTouches[0].clientY-ty;ty=null;if(Math.abs(dy)<25)return;if(dy<0)sheet(sheetState==='min'?'mid':'max');else sheet(sheetState==='max'?'mid':'min')});
sheet();

renderFilters();drawMarkers();updLabels();setTab(tab==='poi'?'intro':tab);
})();
</script>
</body></html>
